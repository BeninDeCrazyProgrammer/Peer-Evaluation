<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluate — PeerEval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .rating-pill { @apply flex-1 py-3 px-2 border-2 border-slate-200 rounded-xl text-sm font-bold transition-all text-slate-600 bg-white hover:border-orange-200; }
        .rating-pill.is-active { @apply border-orange-600 bg-orange-600 text-white shadow-md shadow-orange-200; }
        .step-indicator { @apply w-3 h-3 rounded-full bg-slate-200 transition-all; }
        .step-indicator.is-active { @apply bg-orange-600 w-8; }
        .step-indicator.is-complete { @apply bg-green-500; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-2xl mx-auto px-4 py-12">
        <!-- Brand / Logo -->
        <div class="text-center mb-10">
            <a class="brand text-3xl" href="../index.html">Peer<span class="text-orange-600">Eval</span></a>
        </div>

        <!-- ID Card (Step 0) -->
        <div id="identifyCard" class="bg-white rounded-3xl border border-slate-200 p-8 shadow-xl">
            <span class="eyebrow text-orange-600">Student Access</span>
            <h1 id="evalTitleDisplay" class="text-3xl font-bold text-slate-900 mb-2">Loading...</h1>
            <p class="text-slate-500 mb-8">Please identify yourself to begin the evaluation.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Student ID or Full Name</label>
                    <input type="text" id="identifier" placeholder="e.g. 10984191" 
                           class="w-full p-4 rounded-2xl bg-slate-50 border-2 border-slate-100 focus:border-orange-600 outline-none transition-all text-lg font-medium">
                </div>
                <button id="findBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
                    Begin Evaluation <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
                <div id="identifyError" class="error-box hidden"></div>
            </div>
        </div>

        <!-- The Evaluation Wizard (Step 1+) -->
        <div id="formCard" class="hidden">
            <!-- Progress Header -->
            <div class="flex items-center justify-between mb-6 px-2">
                <div id="stepIndicators" class="flex gap-2">
                    <!-- Dynamic -->
                </div>
                <span id="progressText" class="text-xs font-bold text-slate-400 uppercase tracking-widest">Peer 1 of 4</span>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-xl relative overflow-hidden">
                <div id="wizardGreeting" class="mb-8">
                    <h2 class="text-2xl font-bold text-slate-900" id="currentPeerName">Rating Jane Doe</h2>
                    <p class="text-slate-500">Based on your experience working together this term.</p>
                </div>

                <!-- Criteria Container -->
                <div id="criteriaContainer" class="space-y-8">
                    <!-- Dynamic Criteria Rows -->
                </div>

                <!-- Navigation -->
                <div class="flex gap-4 mt-12 pt-8 border-t border-slate-100">
                    <button id="prevBtn" class="flex-1 py-4 px-6 rounded-2xl border-2 border-slate-100 font-bold text-slate-400 hover:bg-slate-50 transition-all hidden">
                        Back
                    </button>
                    <button id="nextBtn" class="flex-[2] py-4 px-6 rounded-2xl bg-orange-600 text-white font-bold text-lg hover:bg-orange-700 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        Next Peer
                    </button>
                    <button id="submitBtn" class="flex-[2] py-4 px-6 rounded-2xl bg-green-600 text-white font-bold text-lg hover:bg-green-700 transition-all hidden">
                        Finish & Submit
                    </button>
                </div>
                <div id="submitError" class="error-box mt-4 hidden"></div>
            </div>
        </div>

        <!-- Success Message -->
        <div id="doneCard" class="hidden text-center animate-bounce-in">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle-2" class="w-12 h-12"></i>
            </div>
            <h2 class="text-3xl font-bold text-slate-900 mb-2">Submission Received!</h2>
            <p class="text-slate-500">Thank you for your feedback. You may now close this window.</p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="evaluate.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
