<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — PeerEval</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="../index.html">Peer<span>Eval</span></a>
    <div class="row">
      <span class="hint" id="whoami"></span>
      <button class="btn btn--ghost btn--sm" id="logoutBtn">Log out</button>
    </div>
  </div>
  <div class="wrap">
    <h1>Your courses</h1>

    <div class="card">
      <h3>New course</h3>
      <label for="courseName">Course name</label>
      <input type="text" id="courseName" placeholder="BMEN 308">
      <div class="row" style="margin-top:16px">
        <button class="btn" id="createCourseBtn">Create course</button>
      </div>
      <div class="error-box" id="createError" style="display:none"></div>
    </div>

    <div class="card" id="coursesCard">
      <h3>Existing courses</h3>
      <div id="coursesList" class="hint">Loading…</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    const createError = document.getElementById("createError");

    async function checkAuth() {
      const me = await api("/auth/me");
      if (!me.authenticated) {
        window.location.href = "login.html";
        return;
      }
      document.getElementById("whoami").textContent = `${me.name} (${me.email})`;
    }

    async function loadCourses() {
      const courses = await api("/courses");
      const list = document.getElementById("coursesList");
      if (courses.length === 0) {
        list.innerHTML = `<p class="hint">No courses yet — create one above.</p>`;
        return;
      }
      list.innerHTML = "";
      courses.forEach(c => {
        const div = document.createElement("div");
        div.className = "list-item";
        div.innerHTML = `
          <div>
            <strong>${c.name}</strong><br>
            <span class="hint">Created ${new Date(c.created_at).toLocaleDateString()}</span>
          </div>
          <a class="btn btn--ghost btn--sm" href="course.html?course=${c.id}">Open</a>
        `;
        list.appendChild(div);
      });
    }

    document.getElementById("createCourseBtn").addEventListener("click", async () => {
      hideError(createError);
      const name = document.getElementById("courseName").value.trim();
      if (!name) { showError(createError, new Error("Course name is required.")); return; }
      try {
        await api("/courses", { method: "POST", body: JSON.stringify({ name }) });
        document.getElementById("courseName").value = "";
        await loadCourses();
      } catch (err) {
        showError(createError, err);
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await api("/auth/logout", { method: "POST" });
      window.location.href = "login.html";
    });

    checkAuth().then(loadCourses).catch(() => { window.location.href = "login.html"; });
  </script>
</body>
</html>
