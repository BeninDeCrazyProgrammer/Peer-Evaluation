<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Login — PeerEval</title>
<link rel="stylesheet" href="../css/style.css?v=20260818">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="../index.html">Peer<span>Eval</span></a>
  </div>
  <div class="wrap wrap--narrow">
    <h1>Lecturer login</h1>

    <div class="card">
      <div class="row row--between">
        <h3 id="formTitle">Log in</h3>
        <button class="btn btn--ghost btn--sm" id="toggleMode">Need an account?</button>
      </div>

      <div id="nameField" style="display:none">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Dr. Mensah">
      </div>

      <div id="systemKeyField" style="display:none">
        <label for="systemKey">System key</label>
        <div class="password-field">
          <input type="password" id="systemKey" placeholder="Provided by your department">
          <button type="button" class="show-password-btn" data-target="systemKey">Show</button>
        </div>
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@university.edu">

      <label for="password" id="passwordLabel">Password</label>
      <div class="password-field">
        <input type="password" id="password">
        <button type="button" class="show-password-btn" data-target="password">Show</button>
      </div>

      <div id="confirmPasswordField" style="display:none">
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-field">
          <input type="password" id="confirmPassword">
          <button type="button" class="show-password-btn" data-target="confirmPassword">Show</button>
        </div>
      </div>

      <div class="row" id="forgotPasswordRow" style="margin-top:14px">
        <button class="btn btn--ghost btn--sm" id="forgotPasswordLink" type="button">Forgot password?</button>
      </div>

      <div class="row" style="margin-top:20px">
        <button class="btn" id="submitBtn">Log in</button>
        <button class="btn btn--ghost" id="backToLoginBtn" type="button" style="display:none">Back to log in</button>
      </div>

      <div class="error-box" id="errorBox" style="display:none"></div>
      <div class="success-box" id="successBox" style="display:none"></div>
    </div>
  </div>

  <script src="../js/api.js?v=20260817"></script>
  <script src="login.js?v=20260817"></script>
</body>
</html>
