<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Login — PeerEval</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="../index.html">Peer<span>Eval</span></a>
  </div>
  <div class="wrap wrap--narrow">
    <h1>Lecturer login</h1>

    <div class="card">
      <div class="row row--between">
        <h3 id="formTitle">Log in</h3>
        <button class="btn btn--ghost btn--sm" id="toggleMode">Need an account?</button>
      </div>

      <div id="nameField" style="display:none">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Dr. Mensah">
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@university.edu">

      <label for="password">Password</label>
      <input type="password" id="password">

      <div class="row" style="margin-top:20px">
        <button class="btn" id="submitBtn">Log in</button>
      </div>

      <div class="error-box" id="errorBox" style="display:none"></div>
    </div>

    <div class="card">
      <a class="btn btn--ghost" href="#" id="googleBtn" style="width:100%; justify-content:center">
        Continue with Google
      </a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    let mode = "login"; // or "register"
    const errorBox = document.getElementById("errorBox");
    const nameField = document.getElementById("nameField");
    const formTitle = document.getElementById("formTitle");
    const toggleMode = document.getElementById("toggleMode");
    const submitBtn = document.getElementById("submitBtn");

    toggleMode.addEventListener("click", () => {
      mode = mode === "login" ? "register" : "login";
      const isRegister = mode === "register";
      nameField.style.display = isRegister ? "block" : "none";
      formTitle.textContent = isRegister ? "Create account" : "Log in";
      toggleMode.textContent = isRegister ? "Already have an account?" : "Need an account?";
      submitBtn.textContent = isRegister ? "Create account" : "Log in";
      hideError(errorBox);
    });

    submitBtn.addEventListener("click", async () => {
      hideError(errorBox);
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        if (mode === "register") {
          const name = document.getElementById("name").value.trim();
          if (!name || !email || !password) throw new Error("Fill in every field.");
          await api("/auth/register", { method: "POST", body: JSON.stringify({ name, email, password }) });
          await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
        } else {
          if (!email || !password) throw new Error("Fill in every field.");
          await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
        }
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(errorBox, err);
      }
    });

    document.getElementById("googleBtn").addEventListener("click", (e) => {
      e.preventDefault();
      window.location.href = `${API_BASE}/auth/google/start`;
    });
  </script>
</body>
</html>
